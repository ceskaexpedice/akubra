# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Push and Pull requests and JUnit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    environment: BUILD


    steps:

    - name: Check Hazelcast package access
      shell: bash
      run: |
        curl --fail --silent --show-error \
          -u "$USERNAME:$TOKEN" \
          -o /dev/null -w "HTTP %{http_code}\n" \
          https://maven.pkg.github.com/ceskaexpedice/hazelcast-locks-server/org/ceskaexpedice/hazelcast-locks-server/2.0/hazelcast-locks-server-2.0.pom
      env:
        USERNAME: ${{ secrets.USER }}
        TOKEN: ${{ secrets.PAS }}
    
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Set execute permission for gradlew
      run: chmod +x ./gradlew
    - name: Build with Gradle
      run: ./gradlew build
      env:
        USERNAME: ${{ secrets.USER }}
        TOKEN: ${{ secrets.PAS }}
    
